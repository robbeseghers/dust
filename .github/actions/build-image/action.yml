name: "Build Docker Image"
description: "Builds a Docker image using Cloud Build"

inputs:
  project_id:
    description: "Google Cloud project ID"
    required: true
  region:
    description: "Region to build in"
    required: true
  component:
    description: "Component name"
    required: true
  workload_identity_provider:
    description: "Workload Identity Provider"
    required: true
  depot_token:
    description: "Depot project token"
    required: true
  dd_api_key:
    description: "Datadog api key"
    required: false
  dd_client_token:
    description: "Datadog client token"
    required: false
  commit_sha:
    description: "Commit SHA"
    required: true
  commit_sha_long:
    description: "Commit SHA long"
    required: false

runs:
  using: "composite"
  steps:
    - id: "auth"
      name: "Authenticate to Google Cloud"
      uses: "google-github-actions/auth@v2"
      with:
        create_credentials_file: true
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: "github-build-invoker@${{ inputs.project_id }}.iam.gserviceaccount.com"

    - name: "Configure GCP Artifact Auth"
      uses: "google-github-actions/setup-gcloud@v2"
      with:
        install_components: "docker-credential-gcr"

    - name: "Configure GCP Docker Auth"
      shell: bash
      env:
        REGION: ${{ inputs.region }}
      run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

    - name: "Setup Depot"
      uses: "depot/setup-action@v1"

    - name: "Build and Push"
      shell: bash
      env:
        DEPOT_TOKEN: ${{ inputs.depot_token }}
        COMPONENT: ${{ inputs.component }}
        REGION: ${{ inputs.region }}
        PROJECT_ID: ${{ inputs.project_id }}
        COMMIT_SHA: ${{ inputs.commit_sha }}
        COMMIT_SHA_LONG: ${{ inputs.commit_sha_long }}
        DD_API_KEY: ${{ inputs.dd_api_key }}
        DD_CLIENT_TOKEN: ${{ inputs.dd_client_token }}
      run: |
        # Determine environment and base component name
        if [[ ${COMPONENT} == *"-qa" ]]; then
          ENV="qa"
          BASE_COMPONENT=${COMPONENT%-qa}
        elif [[ ${COMPONENT} == *"-edge" ]]; then
          ENV="edge"
          BASE_COMPONENT=${COMPONENT%-edge}
        else
          ENV="prod"
          BASE_COMPONENT=${COMPONENT}
        fi

        CONFIG_FILE=".github/configs/${REGION}/.env.${ENV}"

        build_args=()
        while IFS='=' read -r key value; do
          [[ -n "$key" ]] && build_args+=("--build-arg" "$(echo "$key" | xargs)=$(echo "$value" | xargs)")
        done < "$CONFIG_FILE"

        # Only set the Datadog API key if provided
        if [[ -n "$DD_API_KEY" ]]; then
          build_args+=("--build-arg DATADOG_API_KEY=$DD_API_KEY")
        fi

        # Only set the Datadog client token for front and front-edge builds
        if [[ "$COMPONENT" == "front" || "$COMPONENT" == "front-edge" ]]; then
          build_args+=("--build-arg NEXT_PUBLIC_DATADOG_CLIENT_TOKEN=$DD_CLIENT_TOKEN")
          build_args+=("--build-arg NEXT_PUBLIC_DATADOG_SERVICE=$COMPONENT")
        fi

        depot build \
          --project 3vz0lnf16v \
          --platform linux/amd64 \
          --provenance=false \
          --cache-from type=gha,scope=$COMPONENT \
          --cache-to type=gha,mode=max,scope=$COMPONENT \
          -f ./dockerfiles/${BASE_COMPONENT}.Dockerfile \
          -t ${REGION}-docker.pkg.dev/${PROJECT_ID}/dust-images/${COMPONENT}:${COMMIT_SHA} \
          --build-arg COMMIT_HASH=$COMMIT_SHA \
          --build-arg COMMIT_HASH_LONG=$COMMIT_SHA_LONG \
          ${build_args[@]} \
          --push \
          .
